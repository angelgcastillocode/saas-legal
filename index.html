<!DOCTYPE html>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./assets/styles.css" />

  <!-- Client-Side Document Parsing Libraries (PDF.js & Mammoth.js for DOCX) -->

<body class="bg-background font-body-md text-on-surface antialiased selection:bg-primary/30 selection:text-white">

  <!-- =================================================================== -->
  <!-- PANTALLA COMPLETA DE AUTENTICACIÓN Y REGISTRO (Plantilla de Login)  -->
  <!-- =================================================================== -->
  <div id="auth-screen-container" class="hidden w-full min-h-screen"></div>

  <!-- =================================================================== -->
  <!-- SHELL PRINCIPAL DE LA APLICACIÓN (Sidebar + Header + Vistas SPA)    -->
  <!-- =================================================================== -->
  <div id="app-shell-container">
    <!-- LEFT SIDEBAR (Fidelity Dark Design System) -->
    <aside class="fixed left-0 top-0 h-full w-72 bg-surface-container-lowest text-on-surface z-50 flex flex-col justify-between border-r border-outline-variant shadow-xl">
      <div class="flex flex-col flex-1">
        <!-- Brand Header -->
        <div class="h-16 px-6 flex items-center justify-between border-b border-outline-variant">
          <div class="flex items-center gap-3 cursor-pointer" data-nav-route="dashboard">
            <img

              class="h-8 w-auto object-contain brightness-110"
              src="https://lh3.googleusercontent.com/aida/AEtjO1U7SrAbta4uQXzzVNvyBXyMg9JJBTIbRBq1ZhOlHk2rCPqNkoU7oXXpoCp4s9yn9VvUrUGAoTIFF7w5uck2_JnZf_gGX7-l3RJHeToOWvnRNsKVS2eH3m_AdEuG480P8OE1_CPY0p7wHXdFM5ezbOEbBi3lY9si2FppZDmgzWyYCqpgkl-j4-n1Brql7hN68B5VBFcVFKWnCtxgjce8q2uJycKPTw13YfTPvp-3amTo"
            />
            <span class="font-semibold text-lg tracking-tight text-white font-sans">SaaS Legal</span>
          </div>
          <span class="px-2 py-0.5 rounded-full bg-primary/10 text-primary font-mono-code text-xs border border-primary/20">v2.4 AI</span>
        </div>

        <!-- Primary CTA: Importador Masivo Zero-Touch -->
        <div class="px-5 py-4">
          <button
            data-nav-route="importador"
            class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-primary-container text-white rounded-xl text-sm font-semibold shadow-[0_0_20px_rgba(25,120,229,0.35)] hover:bg-primary transition-all duration-200"
            type="button"
          >
            <span class="material-symbols-outlined text-lg">bolt</span>
            <span>Importar Masivo</span>
            <span class="px-2 py-0.5 bg-white/20 text-white text-[11px] rounded-full font-medium">Zero-Touch</span>
          </button>
        </div>

        <!-- Navigation Links -->
        <nav class="flex-1 px-3 py-2 flex flex-col gap-1">
          <a data-nav-route="dashboard" aria-current="page" class="flex items-center gap-3 px-4 py-2.5 transition-all bg-primary/15 text-primary font-semibold rounded-xl border border-primary/20" href="#dashboard">
            <span class="material-symbols-outlined text-xl">dashboard</span>
            <span class="text-sm">Dashboard</span>
          </a>
          <a data-nav-route="clientes" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-on-surface-variant hover:bg-surface-container-low hover:text-white transition-all" href="#clientes">
            <span class="material-symbols-outlined text-xl">group</span>
            <span class="text-sm">Clientes</span>
          </a>

            <span class="text-sm">Expedientes</span>
          </a>
          <a data-nav-route="documentos" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-on-surface-variant hover:bg-surface-container-low hover:text-white transition-all" href="#documentos">

            <span class="text-sm">Documentos (Repositorio)</span>

          <a data-nav-route="audiencias" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-on-surface-variant hover:bg-surface-container-low hover:text-white transition-all" href="#audiencias">

          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-on-surface-variant uppercase tracking-wider font-medium">Ingesta IA</span>
            <span id="sidebar-quota-pct" class="font-mono-code text-xs text-secondary font-semibold">84.5%</span>

          type="button"
          class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl bg-surface-container-low hover:bg-error/15 text-on-surface-variant hover:text-error border border-outline-variant hover:border-error/30 text-xs font-semibold transition-all"
        >
          <span class="material-symbols-outlined text-base">logout</span>
          <span>Cerrar Sesión / Ver Login</span>
        </button>
      </div>
    </aside>

              <option class="bg-surface-container text-white" value="role-litigator">Rol: Abogado Litigante (Lic. Roberto)</option>
              <option class="bg-surface-container text-white" value="role-paralegal">Rol: Paralegal IA (Lic. Sofía)</option>

            <span class="absolute top-2 right-2 w-2 h-2 bg-error rounded-full ring-2 ring-surface-container-lowest"></span>
          </button>

          <button id="header-login-modal-btn" type="button" class="flex items-center gap-3 pl-2 hover:bg-surface-container-low p-1.5 rounded-xl border border-transparent hover:border-outline-variant transition-all" title="Ir a Pantalla de Login / Cambiar Cuenta">
            <img
              id="header-user-avatar"
              alt="Profile"

              <span id="header-user-role" class="text-xs text-on-surface-variant">Socia Directora Legal Tech</span>
            </div>
          </button>

      <!-- DYNAMIC SPA MAIN VIEWPORT -->

  <!-- GLOBAL MODAL ROOT (Visor Web Integrado, Reclasificación y Cmd+K) -->

  <!-- Application Entry Point (ES Modules) -->
  <script type="module" src="./js/app.js"></script>

</html>
